name: Build and Verify VideoGrab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.mokal147.videograb'" badging.txt
          unzip -t "$APK"
          mkdir -p verified
          cp "$APK" verified/VideoGrabNew-debug.apk
          sha256sum verified/VideoGrabNew-debug.apk > verified/SHA256SUMS.txt
          cp badging.txt verified/

      - uses: actions/upload-artifact@v4
        with:
          name: VideoGrabNew-APK
          path: verified/
          if-no-files-found: error
